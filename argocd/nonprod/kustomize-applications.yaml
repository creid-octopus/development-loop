# ArgoCD ApplicationSet for Kustomize-built developmentloop-demo (non-prod).
# Each environment applies its overlay (namespace + ConfigMap patch) on top of k8s/kustomize/base.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kustomize-applications
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: kustomize-developmentloop-demo-development
            environment: development
            namespace: developmentloop-demo-development
            path: k8s/kustomize/development
          - name: kustomize-developmentloop-demo-test
            environment: test
            namespace: developmentloop-demo-test
            path: k8s/kustomize/test
  template:
    metadata:
      name: '{{ name }}'
      annotations:
        argo.octopus.com/project.pt-argocd-kustomize: "pt-argocd-kustomize"
        argo.octopus.com/environment.pt-argocd-kustomize: '{{ environment }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/creid-octopus/development-loop.git
        targetRevision: HEAD
        name: argocd-kustomize
        path: '{{ path }}'
      destination:
        namespace: '{{ namespace }}'
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
