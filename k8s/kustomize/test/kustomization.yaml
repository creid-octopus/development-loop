# Overlay for Kustomize-built developmentloop-demo (test).
# Applies namespace patch and namePrefix on top of base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namePrefix: kustomize-

namespace: developmentloop-demo-test

patches:
  - target:
      kind: ConfigMap
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: "Test"

  # Environment label on the app pods
  - target:
      kind: Deployment
      name: developmentloop-demo
    patch: |
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1environment
        value: "Test"
