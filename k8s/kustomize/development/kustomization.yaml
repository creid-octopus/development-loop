# Overlay for Kustomize-built developmentloop-demo (development).
# Applies namespace patch and namePrefix on top of base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namePrefix: kustomize-

namespace: developmentloop-demo-development

patches:
  # Patch ConfigMap APP_ENV
  - target:
      kind: ConfigMap
    patch: |
      - op: replace
        path: /data/APP_ENV
        value: "Development"
      - op: replace
        path: /data/PGDATABASE
        value: "developmentloop_development"
      - op: replace
        path: /data/PGUSER
        value: "developmentloop_app_development"

  # Environment label on the app pods
  - target:
      kind: Deployment
      name: developmentloop-demo
    patch: |
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1environment
        value: "Development"

  # Host name for the Ingress
  - target:
      kind: Ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "kustomize-development.developmentloop.localtest.me"
