apiVersion: v1
kind: ConfigMap
metadata:
  name: raw-developmentloop-demo-config
  namespace: developmentloop-demo-production
data:
  APP_ENV: "Production"
  # Database connection. Octopus replaces the #{...} values at deploy time.
  # The password comes from the developmentloop-db Secret.
  PGHOST: "#{Project.Postgres.AppHost}"
  PGPORT: "#{Project.Postgres.Port}"
  PGDATABASE: "#{Project.Postgres.DatabaseName}"
  PGUSER: "#{Project.Postgres.AppRole}"
