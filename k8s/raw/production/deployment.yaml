apiVersion: apps/v1
kind: Deployment
metadata:
  name: raw-developmentloop-demo
  labels:
    app: raw-developmentloop-demo
    app.kubernetes.io/environment: "Production"
  namespace: developmentloop-demo-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raw-developmentloop-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # one extra pod during rollout
      maxUnavailable: 0  # never drop below desired count
  template:
    metadata:
      labels:
        app: raw-developmentloop-demo
        app.kubernetes.io/environment: "Production"
      annotations:
        ad.datadoghq.com/raw-developmentloop-demo: |
          checks:
            http_check:
              - init_config:
                instances:
                  - name: pod health
                    url: "http://%%host%%:3000/health"
                    timeout: 1
    spec:
      containers:
        - name: raw-developmentloop-demo
          image: ghcr.io/creid-octopus/development-loop:latest
          ports:
            - containerPort: 3000
          env:
            # OpenTelemetry. The app sends OTLP to the Datadog Agent on its own node.
            # Version and environment come from APP_VERSION (baked into the image)
            # and APP_ENV (ConfigMap), so no per-release edits are needed here.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_SERVICE_NAME
              value: "raw-developmentloop-demo"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            # Skip the "host" detector. Otherwise host.name is the pod name and
            # Datadog treats every pod as a separate host. The agent fills in the
            # real node name instead.
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: "env,process"
            # Runtime identity — set per environment via ConfigMap or Octopus variable substitution.
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: raw-developmentloop-demo-config
                  key: APP_ENV
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
