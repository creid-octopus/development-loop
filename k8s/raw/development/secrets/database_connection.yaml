# Database password for the app. Octopus replaces the #{...} value at deploy
# time. Never put a real password in this file.
#
# Apply this folder before the app: development/secrets/*, then development/*.
# A plain `kubectl apply -f development/` does not recurse, so the app step
# does not touch this file.
#
# Project variable used:
#   Project.Postgres.AppPassword   sensitive
apiVersion: v1
kind: Secret
metadata:
  name: developmentloop-db
  namespace: developmentloop-demo-development
  labels:
    app: raw-developmentloop-demo
type: Opaque
stringData:
  PGPASSWORD: "#{Project.Postgres.AppPassword}"
