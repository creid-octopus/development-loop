version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "automated-pr"
      - "dependabot:github-actions"
    groups:
      actions:
        patterns:
          - "*"

  # App dependencies. The lockfile lives in src/.
  - package-ecosystem: "npm"
    directory: "/src"
    schedule:
      interval: "weekly"
    labels:
      - "automated-pr"
      - "dependabot:npm"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images in the Dockerfile: node:24-slim and distroless nodejs24.
  # A Node.js runtime fix arrives here, not through npm.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "automated-pr"
      - "dependabot:docker"
    # Stay on Node 24 for every stage. Move to a new major on purpose, not by bot.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Images in docker-compose.yml: Postgres, the Collector, Prometheus, Tempo, and Grafana.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "automated-pr"
      - "dependabot:docker-compose"
    # A Postgres major bump needs pg_upgrade. It also breaks the existing data volume.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns:
          - "*"
